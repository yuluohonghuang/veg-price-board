name: Daily Veg Price Data

# 每天北京 02:30 错峰抓取（UTC 18:30），避开发改委/农业农村部早高峰
# 数据源空窗或限流时脚本快速退出，次日自动重试；支持手动触发测试
on:
  # 代码/脚本变更时立即跑一次（数据回写 commit 不触发，避免死循环）
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'src/main.js'
      - 'index.html'
      - '.github/workflows/daily-data.yml'
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch snapshot + accumulate history
        run: python -u fetch_province_history.py

      - name: Fetch national daily (indexes + market digest)
        run: python -u fetch_national_daily.py

      - name: Fetch Mofcom weekly retail (best-effort)
        run: python -u fetch_cif_retail.py || echo "CIF fetch failed, keep last week"

      - name: Regenerate data files
        run: |
          python -u make_province_data.py
          python -u make_remote_json.py
          python -u make_extra_data.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm deps
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Commit data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ src/
          if ! git diff --cached --quiet; then
            git commit -m "daily data update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no data change, skip commit"
          fi

      - name: Push remote JSON to veg-price-data
        env:
          GITHUB_VEG_TOKEN: ${{ secrets.VEG_DATA_PUSH }}
        run: python -u push_remote_json.py
