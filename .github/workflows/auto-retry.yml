name: Auto Retry Failed Daily Run

# 每日抓取失败（数据源限流、临时网络故障等）时自动重跑一次失败步骤，
# 避免一整天数据因为一次偶发失败而永久缺失。仅重试一次，防死循环。
on:
  workflow_run:
    workflows: ["Daily Veg Price Data"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
